[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitkrakit"
dynamic = ["version"]
description = "A compact desktop Git client built with PySide6 and GitPython"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "GitPython>=3.1.40",
    "agent-client-protocol>=0.11.0,<0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
release = [
    "PyUpdater==4.0",
    "PyInstaller==6.21.0",
]

[project.scripts]
gitkrakit = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gitkrakit*"]

[tool.setuptools.package-data]
gitkrakit = ["resources/fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "gitkrakit.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
