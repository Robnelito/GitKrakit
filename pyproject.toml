[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitkrakit"
version = "0.1.0"
description = "A compact desktop Git client built with PySide6 and GitPython"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "GitPython>=3.1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gitkrakit = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gitkrakit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
